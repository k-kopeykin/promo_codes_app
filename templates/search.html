<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск клиента</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>Поиск клиента</h1>

            {% if total_count is defined %}

                <div class="status success">

                    {% if added_count > 0 %}

                        <p>
                            Добавлено новых клиентов:
                            <strong>{{ added_count }}</strong>
                        </p>

                    {% else %}

                        <p>
                            Файл добавлен. Новых клиентов не найдено
                        </p>

                    {% endif %}

                    

                </div>

            {% endif %}

            <form action="/search" method="post">

                <input
                    type="text"
                    id="id"
                    name="id"
                    placeholder="Введите ID"
                    class="input"
                    required
                >

                <button type="submit" class="button">
                    Найти клиента
                </button>
                
                <a href="/" class="button secondary">
                Назад
            </a>
            
            </form>

        </div>

        

          

    </div>

</body>
</html>
